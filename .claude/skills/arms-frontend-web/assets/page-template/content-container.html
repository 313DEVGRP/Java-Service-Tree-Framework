<!--
	{page} 본문.
	- template.html 의 data-include 가 이 파일을 .row 안에 삽입한다 (루트에 .row 를 또 두지 않는다).
	- Bootstrap 3 그리드만 사용한다 (col-md-* / col-sm-*). BS4/BS5 유틸 금지.
	- 속성은 한 줄에 하나씩 (.prettierrc singleAttributePerLine).
	- id 는 스네이크 케이스(언더바).
-->
<div class="col-md-12">
	<section class="widget">
		<header>
			<h4>
				<span
					class="font13"
					style="font-weight: bold">
					<i
						class="fa fa-list"
						style="vertical-align: middle; font-size: 14px"></i>
					{위젯 제목}
				</span>
			</h4>
			<div class="widget-controls">
				<a
					data-widgster="expand"
					title="Expand"
					href="#">
					<i class="glyphicon glyphicon-chevron-up"></i>
				</a>
				<a
					data-widgster="collapse"
					title="Collapse"
					href="#">
					<i class="glyphicon glyphicon-chevron-down"></i>
				</a>
				<a
					data-widgster="fullscreen"
					title="Fullscreen"
					href="#">
					<i
						class="glyphicon glyphicon-fullscreen"
						style="font-size: 11px"></i>
				</a>
			</div>
		</header>
		<div
			class="body"
			id="page_body">
			<div
				class="gradient_middle_border"
				style="width: 100%; height: 2px"></div>

			<blockquote
				class="font13"
				style="margin-top: 5px">
				<span data-locale="{locale.key.section1}">1. {섹션 제목}</span>
				<div style="float: right">
					<button
						class="btn btn-transparent btn-xs"
						data-help="{대분류}-{page}-section-1">
						Help
						<i
							class="fa fa-question"
							style="font-size: 14px; vertical-align: middle; color: #acacac"></i>
					</button>
				</div>
			</blockquote>

			<div class="clearfix widget-content">
				<div
					style="float: left"
					class="btn-group">
					<button
						class="btn btn-sm edit-blue"
						id="regist_button"
						type="button">
						<i class="fa fa-plus"></i>
						등록
					</button>
					<button
						class="btn btn-sm edit-green"
						id="update_button"
						type="button">
						<i class="fa fa-pencil"></i>
						수정
					</button>
					<button
						class="btn btn-sm edit-red"
						id="delete_button"
						type="button">
						<i class="fa fa-trash"></i>
						삭제
					</button>
				</div>
			</div>

			<!-- thead 는 비워 둔다 — DataTables 가 columnList 의 title 로 헤더를 만든다 -->
			<table
				class="table table-striped"
				id="page_table"
				style="width: 100%">
				<thead></thead>
				<tbody></tbody>
			</table>
		</div>
	</section>
</div>
